# Colleen's AeroSpace config, based closely on the setup shared by her friend.
config-version = 2

after-startup-command = [
    'exec-and-forget sketchybar',
    'exec-and-forget borders hidpi=on active_color=0xff7fbfff inactive_color=0xff494d64 width=5.0',
]

exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    '/opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_workspace_change AEROSPACE_FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE AEROSPACE_PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']
automatically-unhide-macos-hidden-apps = true

persistent-workspaces = [
    '1', '2', '3', '4', '5', '6', '7', '8', '9',
    'I', 'M', 'O', 'P', 'U',
]

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = [{ monitor."studio" = 40 }, 40]
outer.right = 0

[mode.main.binding]

# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'layout floating tiling'
alt-shift-f = 'fullscreen'

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Monitors (arrow keys): plain = look there, shift = send the window there
alt-left = 'focus-monitor --wrap-around left'
alt-right = 'focus-monitor --wrap-around right'
alt-shift-left = 'move-node-to-monitor --wrap-around --focus-follows-window left'
alt-shift-right = 'move-node-to-monitor --wrap-around --focus-follows-window right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Join containers
alt-ctrl-h = ['join-with left', 'mode main']
alt-ctrl-j = ['join-with down', 'mode main']
alt-ctrl-k = ['join-with up', 'mode main']
alt-ctrl-l = ['join-with right', 'mode main']

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Numbered workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Letter workspaces from the friend's setup
alt-i = 'workspace I'
alt-m = 'workspace M'
alt-o = 'workspace O'
alt-p = 'workspace P'
alt-u = 'workspace U'

# Move windows to numbered workspaces
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Move windows to letter workspaces
alt-shift-i = 'move-node-to-workspace I'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-o = 'move-node-to-workspace O'
alt-shift-p = 'move-node-to-workspace P'
alt-shift-u = 'move-node-to-workspace U'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Entering service mode: SketchyBar's on-mode-changed callback doesn't tell us
# which mode we entered, so tell it explicitly via MODE=service.
alt-shift-semicolon = ['mode service', 'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_mode_change MODE=service']

[mode.service.binding]
# Every binding that returns to main mode also notifies SketchyBar via
# MODE=main, for the same reason as above.
esc = ['reload-config', 'mode main', 'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_mode_change MODE=main']
r = ['flatten-workspace-tree', 'mode main', 'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_mode_change MODE=main']
f = ['layout floating tiling', 'mode main', 'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_mode_change MODE=main']
b = ['balance-sizes', 'mode main', 'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_mode_change MODE=main']
backspace = ['close-all-windows-but-current', 'mode main', 'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_mode_change MODE=main']
alt-shift-h = ['join-with left', 'mode main', 'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_mode_change MODE=main']
alt-shift-j = ['join-with down', 'mode main', 'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_mode_change MODE=main']
alt-shift-k = ['join-with up', 'mode main', 'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_mode_change MODE=main']
alt-shift-l = ['join-with right', 'mode main', 'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_mode_change MODE=main']

# Primary workspaces
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace I', 'move left']

[[on-window-detected]]
if.app-name-regex-substring = 'Cursor'
run = ['move-node-to-workspace I', 'move right']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace P']

[[on-window-detected]]
if.app-name-regex-substring = 'Notion'
run = ['move-node-to-workspace O']

# Pages gets its own workspace (unpinned) so it can live on either monitor;
# use alt-shift-tab to throw it between screens.
[[on-window-detected]]
if.app-id = 'com.apple.iWork.Pages'
run = ['move-node-to-workspace M']

# Supporting apps
[[on-window-detected]]
if.app-name-regex-substring = 'Linear'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-name-regex-substring = 'Zoom'
run = ['move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace 7']

[[on-window-detected]]
if.app-name-regex-substring = 'Claude'
run = ['move-node-to-workspace 8']

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace 9']

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['layout floating']

# Refresh SketchyBar whenever a window appears
[[on-window-detected]]
if = 'true'
run = [
    'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_workspace_change',
]

# Multi-monitor layout: comms/music on the small screen, Zoom on the main one.
[workspace-to-monitor-force-assignment]
4 = 'main'
7 = ['secondary', 'built-in']
8 = ['secondary', 'built-in']
9 = ['secondary', 'built-in']
U = ['secondary', 'built-in']
